# Shared prop/tile palette. One char per color; '.' is transparent.
# Ramps go dark -> light. Outline '#' is the same near-black used around the characters.
[colors]
"#" = "#120d14"  # outline
k = "#23222a"    # near-black
K = "#34323d"    # dark grey
g = "#4a4f5e"    # grey
G = "#6b7080"    # mid grey
h = "#9aa0ad"    # light grey
w = "#d0d5de"    # off-white
W = "#f4f6f8"    # white
a = "#191923"    # floor ramp (navy concrete) darkest
A = "#20202c"
s = "#272736"
S = "#2f2f41"
p = "#3a3a50"    # floor ramp lightest
r = "#4a2418"    # rust dark
R = "#7a3e22"    # rust
o = "#b0662f"    # rust light
b = "#5a3a22"    # wood/cardboard dark
B = "#8f6436"    # cardboard
c = "#c89a5a"    # cardboard light
e = "#7d7462"    # beige dark
E = "#aea389"    # beige
f = "#d8cfb4"    # beige light
t = "#1b3d40"    # teal dark
T = "#2c6468"    # teal
u = "#4b9690"    # teal light
d = "#1b3320"    # green dark
D = "#2c5530"    # green
v = "#4d7e3e"    # green light
m = "#6e1650"    # magenta dark
M = "#e8358c"    # magenta neon
n = "#ff8fd4"    # magenta hot
z = "#15506e"    # cyan dark
Z = "#3ff0ff"    # cyan neon
x = "#c4fdff"    # cyan hot
q = "#6e1616"    # red dark
Q = "#d83030"    # red
O = "#ff7a1a"    # orange
y = "#ffcf3a"    # fire yellow
Y = "#fff2a8"    # fire hot
l = "#1e3a82"    # blue dark
L = "#3f78d8"    # blue
j = "#9a7010"    # yellow dark
J = "#e2b224"    # yellow
i = "#e0905a"    # pizza/crust
1 = "#123c4a"    # car paint dark   (placeholder ramp: recolored per variant)
2 = "#1f6e80"    # car paint mid
3 = "#46b4c4"    # car paint light
# wear & texture (see docs/pixel-art.md, "Texture and wear")
C = "#4a3a34"    # grime (dirt, water stains, run-off below bolts and seams)
F = "#1d1820"    # soot (burn marks, deep grime in corners)
P = "#4f5a3c"    # moss / lichen on concrete and wet corners
U = "#3a4658"    # cool steel (metal faces turned toward the moon)
V = "#7a3a6c"    # neon spill (magenta light caught on edges near neon)

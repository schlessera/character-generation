# Prop/tile manifest. Pixels: assets/props/pixel/<name>.txt (hand-drawn, see docs/pixel-art.md).
# Source sheets are only the design reference. Sizes are in game pixels (the character is 32 px tall).
# cell = [row, col] in the source sheet grid. kind: solid (blocks movement at its base),
# decal (flat on the floor, walkable, drawn under characters), tall props are y-sorted.
# glow_anim = per-frame glow strength multiplier.
# emissive = palette chars that stay full-bright under lighting (default for glowing props:
#   neon/fire chars "MnZxyY"); tiles opt in with emissive_tiles below.
# anim = per-frame ms; frame 0 is NAME.txt, frame k is NAME@k.txt.
# base = height in px of the collision footprint measured up from the sprite's bottom edge.
outline = true


# NAME: one line on who they are. Concept art and pixel mockup: concept/
#
# Start: copy to characters/NAME/recipe.toml, set `name`. This file is the STRUCTURE of a recipe
# with no design in it: refit every palette slot from the mockup, map the parts the design has,
# then add rules from references/rule-library.md, one garment feature at a time, each judged on
# `just crops NAME --diff`. Every rule you keep says why it exists: the next reader is an agent
# with the text view open.
#
# Facings: down, down_side, side, up_side, up, and the mirrored down_side_l, side_l, up_side_l.
# Mirroring swaps the anatomical labels and the meaning of front/back. A ONE-SIDED LIMB is a
# [parts] line (leg_l, "arm_r+hand_r"), never a rule on a side: labels follow the mirror. A rule
# on a one-sided trim names its facings explicitly; a symmetric feature seen from both 3/4 views
# needs a rule per view with the part name that view's labels give it.
name = "nyx"
rule_facing = "body"    # trim follows the body through spinning poses: side from the tracked head, front/back from the arms
emissive = ["glow"]     # ramps that stay lit in the dark
emissive_strength = 0.5
# emissive_parts = { "arm_r+hand_r" = 1.0 }      # a part that glows fully (Juno's cyber-arm)
# light = { color = "#3ff0ff", radius = 24, intensity = 0.2, anchor = "arm_r+hand_r" }   # a light the part casts

# Ramps. Template tones pick slots: base, shade, light, blush, ink. Without `ink` the template's
# ink stays (outlines, eyes). These values are placeholders in the shape of a real palette (Juno's);
# read the mockup's colours (`--hex VIEW y0,y1,x0,x1` on flat areas, `--init-palette` after
# [parts]) and replace every slot. A ramp the design lacks: delete it. A material it has and
# this list lacks (a mask, a coat, a tee): add one. Every legend entry below is a FIXED slot
# (`hair.base`), never a tone-relative ramp name: `--draft-grid` picks legend characters by colour.
[palette]
skin    = { base = "#d0a67d", shade = "#c09670", light = "#d6b089", blush = "#cda074", ink = "#211f1c" }  # light olive, lit evenly; ink: the hands' template ink was an off-palette plum
hair    = { base = "#f2e7d8", shade = "#bbae9f", light = "#d7cab9", deep = "#8f8477", ink = "#232220" }  # platinum-white crop
jacket  = { base = "#493e74", shade = "#372f57", light = "#4e447a", ink = "#22201e" }  # the indigo work coat
pants   = { base = "#665c40", shade = "#615840", light = "#6a6043", ink = "#2a2723" }  # olive cargos (legs carry only shade and ink)
shirt   = { base = "#434242", shade = "#3a3938" }                                     # the dark grey tee
shoes   = { base = "#2a2825", shade = "#1e1d1a", light = "#45443e" }                  # black combat boots; light = their grey highlight
chrome  = { base = "#b5b5b6", shade = "#969596", light = "#f0ede8", ink = "#6f6e6d" }  # the cyber-shin
trim    = { base = "#9cbf32", shade = "#7e9024" }                                     # lime piping, laces, knee seam
glow    = { base = "#a8ce32", shade = "#88a223", light = "#d4ef6e" }                  # goggle lenses and the mask LED
fx      = { base = "#c8f06a", shade = "#9cbf32", light = "#eaffb0" }                  # the attack's swing smears, lime
outline = { base = "#211f1c" }                       # near-black, warm
visor   = { base = "#1c1b17", shade = "#2e2f24" }    # goggle rims and strap
mask    = { base = "#454444", shade = "#3a3937" }    # the charcoal respirator

# Part/group -> ramp. LATER LINES WIN: groups first, specific parts after (a `neck` line before
# `body` is silently overridden). `fx` unmapped renders the attack smears as blobs.
[parts]
head = "skin"
body = "jacket"
neck = "skin"
hands = "skin"
legs = "pants"
feet = "shoes"
leg_l = "chrome"    # the cyber-shin: her anatomical LEFT leg, labels follow the mirror
fx = "fx"

[outline]
color = "outline"
keep = "*"          # every grid cell keeps its colour on the silhouette edge: a drafted grid carries the mockup's
                    # own outline cells ("kSs" for hand-drawn grids where only the hair outline and the ear should)
# parts = { legs = "pants.ink" }   # selective outlining: a part edged in its own dark

# ---- rules: none yet. Order: grow/shrink -> shading -> collar -> hem -> opening -> sleeves ->
# shoes -> limb details. Take each from references/rule-library.md; `--widths` before any grow.
# Syntax of one rule (a cuff), each key on its own line under a double-bracket rules header:
#   type = "edge", part = "arm_l", touching = "hand_l", color = "trim.shade"
# (the header itself is not written here: scripts that split the file on it would count it)

# silhouette: the coat's far shoulder stands out in 3/4 front (--widths +3/+4 right in down_side, +2 in down_side_l)
[[rules]]
type = "grow"
part = "torso"
sides = ["front"]
n = 3
facings = ["down_side"]
color = "jacket.base"

[[rules]]
type = "grow"
part = "torso"
sides = ["front"]
n = 2
facings = ["down_side_l"]
color = "jacket.base"

# 3/4 front left: the far sleeve and hand stand beside the coat (the mockup's lime band and hand two columns out)
[[rules]]
type = "grow"
part = "arm_r"
sides = ["front"]
n = 2
facings = ["down_side_l"]
color = "jacket.base"

[[rules]]
type = "grow"
part = "hand_r"
sides = ["front"]
n = 1
facings = ["down_side_l"]
color = "skin.base"

# from behind the mockup's sleeves hang a column closer to the body (--widths -2 at rows 23-26)
[[rules]]
type = "shrink"
part = "arms+hands"
sides = ["left"]
facings = ["up", "up_side"]

[[rules]]
type = "shrink"
part = "arms+hands"
sides = ["right"]
facings = ["up", "up_side_l"]

# hem from behind: the coat falls over the thighs; two leg rows of coat, the lime hem band on the first
[[rules]]
type = "rows"
part = "legs"
from = "top"
n = 2
ink = true
facings = ["up", "up_side", "up_side_l"]
color = "jacket"

[[rules]]
type = "rows"
part = "legs"
from = "top"
n = 1
ink = true
facings = ["up", "up_side", "up_side_l"]
color = "trim.base"

# the open coat, front and 3/4 front: a four-column strip, tee (4 rows), belt (1 row), pants below
[[rules]]
type = "stripe"
straight = true
part = "torso"
offsets = [-2, -1, 0, 1]
top = 4
facings = ["down", "down_side", "down_side_l"]
color = "shirt"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offsets = [-2, -1, 0, 1]
skip = 4
top = 1
facings = ["down", "down_side", "down_side_l"]
color = "outline.base"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offsets = [-2, -1, 0, 1]
skip = 5
facings = ["down", "down_side", "down_side_l"]
color = "pants.base"

# front only: the lapels' inner edges are dark beside a two-column tee (the strip's outer columns)
[[rules]]
type = "stripe"
straight = true
part = "torso"
offsets = [-2, 1]
top = 4
facings = ["down"]
color = "outline.base"

# lime band round the sleeve at mid-arm; lost in the other facings (per-view scoring)
[[rules]]
type = "band"
part = "arms"
at = 0.5
facings = ["down", "side", "side_l", "up_side_l"]
color = "trim.base"

# back emblem: a small lime mark between the shoulders, centred and straight
[[rules]]
type = "band"
part = "torso"
at = 0.125
anchor = "center"
straight = true
facings = ["up", "up_side", "up_side_l"]
color = "trim.base"

[[rules]]
type = "band"
part = "torso"
at = 0.25
anchor = "center"
straight = true
facings = ["up", "up_side", "up_side_l"]
color = "trim.base"

[[rules]]
type = "band"
part = "arm_r"
at = 0.3
facings = ["down_side_l"]
color = "trim.base"

# from straight behind the shrink leaves the two-pixel hands as outline: the mockup's hands show at the
# sleeve ends, so the arm's last row is skin
[[rules]]
type = "rows"
part = "arms"
from = "bottom"
n = 1
facings = ["up"]
color = "skin.base"

# the sleeve's dark open end above the hand (profile, 3/4 back, the grown far sleeve in 3/4 front left)
[[rules]]
type = "rows"
part = "arm_r"
from = "bottom"
n = 1
facings = ["side", "up_side", "up_side_l", "down_side_l"]
color = "outline.base"

# hands in the pockets: in the 3/4 and profile views the coat skirt covers the template's hand, its lime
# hem on the hand's bottom row; in the right profile the whole hand is coat. A coat rule on a hand is
# wrong wherever the arm swings, so only the calm animations.
[[rules]]
type = "all"
part = "hands"
facings = ["side"]
anims = ["idle", "walk", "rotate", "interact"]
color = "jacket"

[[rules]]
type = "rows"
part = "hands"
from = "bottom"
n = 1
facings = ["down_side", "side", "side_l", "down_side_l"]
anims = ["idle", "walk", "rotate", "interact"]
color = "trim.base"

# the pocket's edge: a dark column on the hand's back side in the 3/4 views
[[rules]]
type = "region"
part = "hands"
anchor = "back"
n = 1
facings = ["down_side", "up_side", "up_side_l", "down_side_l"]
anims = ["idle", "walk", "rotate", "interact"]
color = "outline.base"

# boots: black, with a grey lacing column down the middle of each boot (shoes.light). A stripe on the
# `feet` group takes ONE median column for both feet (it fell between them): one rule per foot.
[[rules]]
type = "stripe"
straight = true
part = "foot_r"
color = "shoes.light"

[[rules]]
type = "stripe"
straight = true
part = "foot_l"
facings = ["down", "down_side", "side", "up_side_l", "side_l", "down_side_l"]
color = "shoes.light"

# the cyber-shin's lime knee seam: the shin's top visible row (emissive)
[[rules]]
type = "rows"
part = "leg_l"
from = "top"
n = 1
facings = ["down", "down_side", "side_l"]
color = "glow.base"

# the chrome runs into the boot's top row on the cyber-leg; a dark back edge down the shin in profile
[[rules]]
type = "rows"
part = "foot_l"
from = "top"
n = 1
facings = ["down", "up_side", "up", "up_side_l", "side_l"]
color = "chrome.base"

[[rules]]
type = "region"
part = "leg_l"
anchor = "back"
n = 1
facings = ["side", "up_side_l", "side_l"]
color = "outline.base"

# ---- head grids: `just compare NAME --draft-grid all --all-slots --clean --apply` -------------
# (add --mirror-swap only for a FIVE-view mockup of a one-sided haircut). Grid = head template
# padded by 3, '.' keeps the template. `just heads NAME` prints alignment.

# Which legend characters the grid tools may treat as what. `--clean` moves `rim` characters off
# rows that are not `lens` rows, despeckles inside `hair` and `texture` and keeps only `hair`
# (minus its first character, the outline) on the row below the jaw, each of those two passes
# only where it does not lower the view's score; `--mirror-swap` swaps `texture` and `hair` and
# caps a lens with `caps`. Anything not listed (a mask, an ear, skin) is left alone.
[head.classes]
hair = "kbHDi"      # outline first, then the mane's base, shade, deep, light
texture = ""        # a second surface cleaned like hair (a shaved side): "uUw" on Juno; "" if none
lens = "v"
rim = "x"
caps = "x"

# The legend: every material the mockup paints on the head AND in the grid's rows beside and
# below it (a collar, a mask, a hat) — the draft picks legend colours only; `--all-slots` adds
# the missing ones itself.
[head.legend]
b = "hair.base"
H = "hair.shade"    # strand lines
D = "hair.deep"
i = "hair.light"
k = "hair.ink"      # hair outline
S = "skin.base"
s = "skin.shade"
x = "visor.base"    # eyewear rim (and the lens' end caps)
v = "glow.base"     # lens
o = "outline.base"  # outline drawn by the grid (an ear beside the head)
m = "mask.base"     # the respirator half-mask
M = "mask.shade"
c = "jacket.base"   # the coat collar in the head's last rows
t = "trim.base"     # lime piping on the collar
"-" = "clear"
C = "#b5b5b6"   # chrome.base at draft time (--all-slots); a literal, so the grid keeps this colour
I = "#6f6e6d"   # chrome.ink at draft time (--all-slots); a literal, so the grid keeps this colour
V = "#2e2f24"   # visor.shade at draft time (--all-slots); a literal, so the grid keeps this colour
a = "#969596"   # chrome.shade at draft time (--all-slots); a literal, so the grid keeps this colour
g = "#88a223"   # glow.shade at draft time (--all-slots); a literal, so the grid keeps this colour
j = "#372f57"   # jacket.shade at draft time (--all-slots); a literal, so the grid keeps this colour
p = "#665c40"   # pants.base at draft time (--all-slots); a literal, so the grid keeps this colour


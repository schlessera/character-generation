# NAME: one line on who they are. Concept art and pixel mockup: concept/
#
# Start: copy to characters/NAME/recipe.toml, set `name`. This file is the STRUCTURE of a recipe
# with no design in it: refit every palette slot from the mockup, map the parts the design has,
# then add rules from references/rule-library.md, one garment feature at a time, each judged on
# `just crops NAME --diff`. Every rule you keep says why it exists: the next reader is an agent
# with the text view open.
#
# Facings: down, down_side, side, up_side, up, and the mirrored down_side_l, side_l, up_side_l.
# Mirroring swaps the anatomical labels and the meaning of front/back. A ONE-SIDED LIMB is a
# [parts] line (leg_l, "arm_r+hand_r"), never a rule on a side: labels follow the mirror. A rule
# on a one-sided trim names its facings explicitly; a symmetric feature seen from both 3/4 views
# needs a rule per view with the part name that view's labels give it.
name = "nyx"
rule_facing = "body"    # trim follows the body through spinning poses: side from the tracked head, front/back from the arms
emissive = ["glow"]     # ramps that stay lit in the dark
emissive_strength = 0.5
# emissive_parts = { "arm_r+hand_r" = 1.0 }      # a part that glows fully (Juno's cyber-arm)
# light = { color = "#3ff0ff", radius = 24, intensity = 0.2, anchor = "arm_r+hand_r" }   # a light the part casts

# Ramps. Template tones pick slots: base, shade, light, blush, ink. Without `ink` the template's
# ink stays (outlines, eyes). Any other slot name is allowed (`deep`, `dark`, `soft`): the
# template never picks it, but a legend letter or a rule's `ramp.slot` can, so a colour the
# draft reports as missing goes on the ramp it belongs to (`hair.dark`, `skin.deep`). These values are placeholders in the shape of a real palette (Juno's);
# read the mockup's colours (`--hex VIEW y0,y1,x0,x1` on flat areas, `--init-palette` after
# [parts]) and replace every slot. A ramp the design lacks: delete it. A material it has and
# this list lacks (a mask, a coat, a tee): add one. Every legend entry below is a FIXED slot
# (`hair.base`), never a tone-relative ramp name: `--draft-grid` picks legend characters by colour.
[palette]
skin    = { base = "#d1a77f", shade = "#c49b74", light = "#d4ac85", blush = "#cfa57c", deep = "#956844", ink = "#211f1c" }  # lit evenly; ink = outline
hair    = { base = "#f2e7d8", shade = "#bbaf9f", light = "#f5ecdf", deep = "#7d7465", soft = "#d6c9b8", ink = "#211f1c" }  # platinum crop: strand lines in shade, underside deep
jacket  = { base = "#4a4076", shade = "#3a305a", light = "#4e447a", ink = "#211f1c" }  # the indigo coat
pants   = { base = "#4a4331", shade = "#635a3e", light = "#685f41", ink = "#211f1c" }  # olive cargos: legs paint shade (main) and ink
shirt   = { base = "#434241", shade = "#3c3b3a" }                                     # dark grey tee
shoes   = { base = "#454444", shade = "#2e2d2d", light = "#515151", ink = "#211f1c" }  # black boots
chrome  = { base = "#b5b5b6", shade = "#999895", light = "#f0ede8", ink = "#515151" }  # on a leg the template paints only shade and ink
trim    = { base = "#a0c236", shade = "#94ae2e" }                                     # lime piping
glow    = { base = "#a8ce34", shade = "#8dae29", light = "#c6f060" }                  # goggle lenses, mask LED, knee seam
fx      = { base = "#b6ff3a", shade = "#8dcc2a", light = "#e0ffa0" }                  # the attack's swing smears
outline = { base = "#211f1c" }                       # near black
visor   = { base = "#1c1a17", shade = "#2e2e2b" }    # goggle rims
mask    = { base = "#444343", shade = "#3c3b3a" }    # respirator half-mask

# Part/group -> ramp. LATER LINES WIN: groups first, specific parts after (a `neck` line before
# `body` is silently overridden). `fx` unmapped renders the attack smears as blobs.
[parts]
head = "skin"
body = "jacket"
neck = "skin"
hands = "skin"
legs = "pants"
feet = "shoes"
leg_l = "chrome"    # the cyber-shin: her anatomical LEFT leg, every frame
fx = "fx"

[outline]
color = "outline"
keep = "*"          # every grid cell keeps its colour on the silhouette edge: a drafted grid carries the mockup's
                    # own outline cells ("kSs" for hand-drawn grids where only the hair outline and the ear should)
# parts = { legs = "pants.ink" }   # selective outlining: a part edged in its own dark

# ---- rules: none yet. Order: grow/shrink -> shading -> collar -> hem -> opening -> sleeves ->
# shoes -> limb details. Take each from references/rule-library.md; `--widths` before any grow.
# Syntax of one rule (a cuff), each key on its own line under a double-bracket rules header:
#   type = "edge", part = "arm_l", touching = "hand_l", color = "trim.shade"
# (the header itself is not written here: scripts that split the file on it would count it)

# ---- silhouette (from --widths and --try) -------------------------------------------------
[[rules]]  # 3/4 front: the far shoulder / upper coat stands 3 px beyond the mannequin (--widths +3/+4)
type = "grow"; part = "torso"; sides = ["front"]; n = 3; facings = ["down_side", "down_side_l"]; color = "jacket.base"
[[rules]]  # 3/4 front: the far sleeve beside the torso
type = "grow"; part = "arm_l"; sides = ["front"]; n = 2; facings = ["down_side"]; color = "jacket.base"
[[rules]]  # from behind the coat's sleeves sit a column in from the mannequin's arms
type = "shrink"; part = "arms+hands"; sides = ["left"]; facings = ["up", "up_side"]
[[rules]]
type = "shrink"; part = "arms+hands"; sides = ["right"]; facings = ["up", "up_side", "up_side_l"]
[[rules]]  # ...the shrink leaves one inked pixel for a hand from straight behind: the hands back
type = "rows"; part = "arms"; from = "bottom"; n = 1; facings = ["up"]; color = "skin.base"

# ---- shading ---------------------------------------------------------------------------------
[[rules]]  # profile: the coat's back fold, a dark line inside the back edge
type = "region"; part = "torso"; anchor = "left"; n = 1; facings = ["side"]; color = "outline.base"

# ---- collar ----------------------------------------------------------------------------------
[[rules]]  # profile: the coat's collar row, lime
type = "rows"; part = "torso"; from = "top"; n = 1; facings = ["side", "side_l"]; color = "trim.base"
[[rules]]  # profile: the piping down the coat's front edge, one pixel inside the edge
type = "stripe"; part = "torso"; anchor = "front"; offset = -1; facings = ["side", "side_l"]; color = "trim.base"

# ---- hands in the pockets (before the hem, which crosses them) ----

# ---- hem -------------------------------------------------------------------------------------
[[rules]]  # from behind the coat falls over the thighs: two leg rows of coat (a leg rule depicting the coat: no run/jump/attack)
type = "rows"; part = "legs"; from = "top"; n = 2; ink = true; facings = ["up", "up_side", "up_side_l"]; anims = ["idle", "walk", "rotate", "interact"]; color = "jacket"
[[rules]]  # ...with the lime hem band on the first
type = "rows"; part = "legs"; from = "top"; n = 1; ink = true; facings = ["up", "up_side", "up_side_l", "side_l"]; anims = ["idle", "walk", "rotate", "interact"]; color = "trim.base"
[[rules]]  # the hem crosses the hands resting in the pockets
type = "rows"; part = "hands"; from = "bottom"; n = 1; facings = ["down_side", "side", "side_l", "up_side_l"]; anims = ["idle", "walk", "rotate", "interact"]; color = "trim.base"

# ---- opening: the open coat shows the tee (4 rows), a belt, then the pants ------------------------
[[rules]]
type = "stripe"; straight = true; part = "torso"; offsets = { "*" = [-2, -1, 0, 1], down_side_l = [-3, -2, -1, 0] }; top = 4; facings = ["down", "down_side", "down_side_l"]; color = "shirt"
[[rules]]
type = "stripe"; straight = true; part = "torso"; offsets = { "*" = [-2, -1, 0, 1], down_side_l = [-3, -2, -1, 0] }; skip = 4; top = 1; facings = ["down", "down_side", "down_side_l"]; color = "outline.base"
[[rules]]
type = "stripe"; straight = true; part = "torso"; offsets = { "*" = [-2, -1, 0, 1], down_side_l = [-3, -2, -1, 0] }; skip = 5; facings = ["down", "down_side", "down_side_l"]; color = "pants.base"
[[rules]]  # the lapels' dark inner edges
type = "stripe"; straight = true; part = "torso"; offsets = [-2, 1]; top = 4; facings = ["down"]; color = "outline.base"

# ---- sleeves and hands -------------------------------------------------------------------------
[[rules]]  # a lime band round the forearm
type = "band"; part = "arms"; at = 0.5; facings = ["down", "side", "side_l", "up_side_l"]; color = "trim.base"

# ---- back emblem -------------------------------------------------------------------------------
[[rules]]
type = "band"; part = "torso"; at = 0.25; anchor = "center"; straight = true; facings = ["up", "up_side", "up_side_l"]; color = "trim.base"
[[rules]]
type = "band"; part = "torso"; at = 0.375; anchor = "center"; straight = true; facings = ["up", "up_side", "up_side_l"]; color = "trim.base"

# ---- boots -------------------------------------------------------------------------------------
[[rules]]  # one lime lace pixel per boot
type = "band"; part = "feet"; at = 0.0; anchor = "center"; each = true; facings = ["down_side", "side_l"]; color = "trim.base"

# ---- cyber-shin --------------------------------------------------------------------------------
[[rules]]  # the lime knee seam at the top of the visible shin
type = "band"; part = "leg_l"; at = 0.0; facings = ["down", "down_side", "up_side", "up", "up_side_l", "side_l"]; color = "glow.base"
[[rules]]  # the shin's polished back edge in 3/4 front
type = "stripe"; part = "leg_l"; anchor = "back"; facings = ["down_side"]; color = "chrome.light"
[[rules]]  # chrome down the foot where the mockup shows no boot
type = "region"; part = "foot_l"; anchor = "left"; facings = ["down", "down_side", "up_side", "up"]; color = "chrome"

# ---- found by --sweep / --try after the library rules (appended last, as they were scored) ----
[[rules]]  # the shoulder seam, front only (lost in every other view)
type = "rows"; part = "arms"; from = "top"; n = 1; facings = ["down"]; color = "outline.base"
[[rules]]  # the hands sit in the pockets: one dark column per hand leaves the mockup's one-pixel hand
type = "stripe"; straight = true; part = "hands"; each = true; facings = ["down_side", "side", "up_side_l", "side_l", "down_side_l"]; color = "outline.base"
[[rules]]  # the boot's grey upper down its middle
type = "stripe"; straight = true; part = "feet"; each = true; facings = ["down", "down_side", "side", "up_side_l", "side_l", "down_side_l"]; color = "shoes.base"
[[rules]]  # the right boot is lower than the template's foot: the cargo tucked into its top row
type = "rows"; from = "top"; n = 1; part = "foot_r"; facings = ["down", "up_side", "up", "up_side_l", "down_side_l"]; color = "pants.base"
[[rules]]  # the cyber-shin ends in a black boot toe
type = "region"; anchor = "front"; n = 1; part = "foot_l"; facings = ["down", "side", "up", "side_l", "down_side_l"]; color = "outline.base"

# ---- head grids: `just compare NAME --draft-grid all --all-slots --clean --apply` -------------
# (add --mirror-swap only for a FIVE-view mockup of a one-sided haircut). Grid = head template
# padded by 3, '.' keeps the template. `just heads NAME` prints alignment.

# Which legend characters the grid tools may treat as what. `--clean` moves `rim` characters off
# rows that are not `lens` rows, despeckles inside `hair` and `texture` and keeps only `hair`
# (minus its first character, the outline) on the row below the jaw, each of those two passes
# only where it does not lower the view's score; `--mirror-swap` swaps `texture` and `hair` and
# caps a lens with `caps`. Anything not listed (a mask, an ear, skin) is left alone.
[head.classes]
hair = "kbHDih"     # outline first, then the mane's base, shade, deep, light
texture = ""        # a second surface cleaned like hair (a shaved side): "uUw" on Juno; "" if none
lens = "v"
rim = "x"
caps = "x"

# The legend: every material the mockup paints on the head AND in the grid's rows beside and
# below it (a collar, a mask, a hat) — the draft picks legend colours only; `--all-slots` adds
# the missing ones itself.
[head.legend]
b = "hair.base"
H = "hair.shade"    # strand lines
D = "hair.deep"
i = "hair.light"
k = "hair.ink"      # hair outline
S = "skin.base"
s = "skin.shade"
x = "visor.base"    # eyewear rim (and the lens' end caps)
v = "glow.base"     # lens
o = "outline.base"  # outline drawn by the grid (an ear beside the head)
"-" = "clear"
C = "#b5b5b6"   # --all-slots: the nearest slot was chrome.base; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
J = "#3a305a"   # --all-slots: the nearest slot was jacket.shade; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
P = "#635a3e"   # --all-slots: the nearest slot was pants.shade; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
a = "#3c3b3a"   # --all-slots: the nearest slot was shirt.shade; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
c = "#2e2d2d"   # --all-slots: the nearest slot was shoes.shade; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
d = "#999895"   # --all-slots: the nearest slot was chrome.shade; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
j = "#4a4076"   # --all-slots: the nearest slot was jacket.base; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
l = "#515151"   # --all-slots: the nearest slot was shoes.light; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
p = "#4a4331"   # --all-slots: the nearest slot was pants.base; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
t = "#94ae2e"   # --all-slots: the nearest slot was trim.shade; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
e = "#956844"   # --all-slots: the nearest slot was skin.deep; a literal (the grid keeps this colour); rename or move it to the ramp it depicts
h = "#d6c9b8"   # --all-slots: the nearest slot was hair.soft; a literal (the grid keeps this colour); rename or move it to the ramp it depicts


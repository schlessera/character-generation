# Nyx "Halo" Ferreira: rooftop drone mechanic, open indigo coat, chrome left shin, goggles and mask. Concept art and pixel mockup: concept/
#
# Start: copy to characters/NAME/recipe.toml, set `name`. This file is the STRUCTURE of a recipe
# with no design in it: refit every palette slot from the mockup, map the parts the design has,
# then add rules from references/rule-library.md, one garment feature at a time, each judged on
# `just crops NAME --diff`. Every rule you keep says why it exists: the next reader is an agent
# with the text view open.
#
# Facings: down, down_side, side, up_side, up, and the mirrored down_side_l, side_l, up_side_l.
# Mirroring swaps the anatomical labels and the meaning of front/back. A ONE-SIDED LIMB is a
# [parts] line (leg_l, "arm_r+hand_r"), never a rule on a side: labels follow the mirror. A rule
# on a one-sided trim names its facings explicitly; a symmetric feature seen from both 3/4 views
# needs a rule per view with the part name that view's labels give it.
name = "nyx"
rule_facing = "body"    # trim follows the body through spinning poses: side from the tracked head, front/back from the arms
emissive = ["glow"]     # ramps that stay lit in the dark
emissive_strength = 0.5
# emissive_parts = { "arm_r+hand_r" = 1.0 }      # a part that glows fully (Juno's cyber-arm)
# light = { color = "#3ff0ff", radius = 24, intensity = 0.2, anchor = "arm_r+hand_r" }   # a light the part casts

# Ramps. Template tones pick slots: base, shade, light, blush, ink. Without `ink` the template's
# ink stays (outlines, eyes). These values are placeholders in the shape of a real palette (Juno's);
# read the mockup's colours (`--hex VIEW y0,y1,x0,x1` on flat areas, `--init-palette` after
# [parts]) and replace every slot. A ramp the design lacks: delete it. A material it has and
# this list lacks (a mask, a coat, a tee): add one. Every legend entry below is a FIXED slot
# (`hair.base`), never a tone-relative ramp name: `--draft-grid` picks legend characters by colour.
[palette]
skin    = { base = "#d0a67d", shade = "#a8906f", light = "#d4ac85", blush = "#cda074", dark = "#8a6343", ink = "#211f1c" }  # light olive, lit evenly; dark = skin in the hair's shadow
hair    = { base = "#f2e7d8", shade = "#bbaf9e", light = "#f5ede1", deep = "#9e9082", dark = "#7a7064", ink = "#211f1c" }  # platinum crop; strands in shade, the nape in dark
jacket  = { base = "#4a3f75", shade = "#3a315b", light = "#4e447a", ink = "#211f1c" }  # indigo work coat, flat fabric
pants   = { base = "#685f41", shade = "#635a3e", light = "#685f41", ink = "#211f1c" }  # olive cargos
shirt   = { base = "#424141", shade = "#3c3b3b" }                                     # dark grey tee
shoes   = { base = "#2e2d2d", shade = "#232220", light = "#454444" }                    # black combat boots
chrome  = { base = "#b5b5b6", shade = "#999895", light = "#c8c7c3", ink = "#211f1c" }  # the left shin: legs carry only shade+ink tones, so shade is the chrome
trim    = { base = "#9ebe34", shade = "#7e9024" }                                     # lime piping and laces
glow    = { base = "#a7cd31", shade = "#88a223", light = "#b4d63c" }                  # goggle lenses, mask LED, knee seam
fx      = { base = "#b6ff3a", shade = "#88c02c", light = "#e2ffa8" }                  # the attack's swing smears, lime
outline = { base = "#211f1c" }                       # near black
visor   = { base = "#2b2a27", shade = "#3b3839" }    # goggle rims and strap
mask    = { base = "#454444", shade = "#2e2e2b" }    # charcoal respirator half-mask

# Part/group -> ramp. LATER LINES WIN: groups first, specific parts after (a `neck` line before
# `body` is silently overridden). `fx` unmapped renders the attack smears as blobs.
[parts]
head = "skin"
body = "jacket"
neck = "skin"
hands = "skin"
legs = "pants"
feet = "shoes"
leg_l = "chrome"   # the cyber-shin, her anatomical left: follows the mirror
fx = "fx"

[outline]
color = "outline"
keep = "*"          # every grid cell keeps its colour on the silhouette edge: a drafted grid carries the mockup's
                    # own outline cells ("kSs" for hand-drawn grids where only the hair outline and the ear should)
# parts = { legs = "pants.ink" }   # selective outlining: a part edged in its own dark

# ---- rules: none yet. Order: grow/shrink -> shading -> collar -> hem -> opening -> sleeves ->
# shoes -> limb details. Take each from references/rule-library.md; `--widths` before any grow.
# Syntax of one rule (a cuff), each key on its own line under a double-bracket rules header:
#   type = "edge", part = "arm_l", touching = "hand_l", color = "trim.shade"
# (the header itself is not written here: scripts that split the file on it would count it)

# ---- rules (candidates from the rule library, facings from per-view --try gains, step 4)

[[rules]]  # the coat's back fold / flank: a dark line inside the back edge (3/4 and profile)
type = "region"
part = "torso"
anchor = "back"
n = 1
facings = ["down_side", "side", "up_side", "down_side_l"]
color = "outline.base"

[[rules]]  # from behind the coat falls over the thighs: two leg rows of coat...
type = "rows"
part = "legs"
from = "top"
n = 2
ink = true
facings = ["up", "up_side", "up_side_l"]
color = "jacket"

[[rules]]  # ...with the lime hem band on the first (also in profile-left, where the skirt's hem shows)
type = "rows"
part = "legs"
from = "top"
n = 1
ink = true
facings = ["up", "up_side", "up_side_l", "side_l"]
color = "trim.base"

[[rules]]  # open coat, front and 3/4 front: a four-column strip, the tee for the first four rows...
type = "stripe"
straight = true
part = "torso"
offsets = [-2, -1, 0, 1]
top = 4
facings = ["down", "down_side", "down_side_l"]
color = "shirt"

[[rules]]  # ...the belt on the fifth...
type = "stripe"
straight = true
part = "torso"
offsets = [-2, -1, 0, 1]
skip = 4
top = 1
facings = ["down", "down_side", "down_side_l"]
color = "outline.base"

[[rules]]  # ...and the pants below
type = "stripe"
straight = true
part = "torso"
offsets = [-2, -1, 0, 1]
skip = 5
facings = ["down", "down_side", "down_side_l"]
color = "pants.shade"

[[rules]]  # the lapels' dark inner edges beside the tee
type = "stripe"
straight = true
part = "torso"
offsets = [-2, 1]
top = 4
facings = ["down", "down_side_l"]
color = "outline.base"

[[rules]]  # hands in the pockets: the sleeve covers the hand where the mockup shows none
type = "all"
part = "hands"
facings = ["down_side", "side", "side_l"]
anims = ["idle", "walk", "rotate", "interact"]
color = "jacket"

[[rules]]  # the sleeve's dark open end over the hand
type = "rows"
part = "hands"
from = "bottom"
n = 1
facings = ["down_side", "side", "up_side", "up_side_l", "side_l", "down_side_l"]
color = "outline.base"

[[rules]]  # lime cuff band round the forearm
type = "band"
part = "arms"
at = 0.5
facings = ["down", "side", "up_side_l", "side_l"]
color = "trim.base"

[[rules]]  # the shoulder seam
type = "rows"
part = "arms"
from = "top"
n = 1
facings = ["down", "up_side", "up"]
color = "outline.base"

[[rules]]  # the lime cross between the shoulders, two centred pixels
type = "band"
part = "torso"
at = 0.25
anchor = "center"
straight = true
facings = ["up", "up_side", "up_side_l"]
color = "trim.base"

[[rules]]
type = "band"
part = "torso"
at = 0.375
anchor = "center"
straight = true
facings = ["up", "up_side", "up_side_l"]
color = "trim.base"

[[rules]]  # profile: lime piping one pixel inside the coat's front edge
type = "stripe"
part = "torso"
anchor = "front"
offset = -1
facings = ["side", "side_l"]
color = "trim.base"

[[rules]]  # the knee seam at the top of the chrome shin
type = "band"
part = "leg_l"
at = 0.0
facings = ["down", "up_side", "up", "up_side_l", "side_l"]
color = "glow.base"

# ---- head grids: `just compare NAME --draft-grid all --all-slots --clean --apply` -------------
# (add --mirror-swap only for a FIVE-view mockup of a one-sided haircut). Grid = head template
# padded by 3, '.' keeps the template. `just heads NAME` prints alignment.

# Which legend characters the grid tools may treat as what. `--clean` moves `rim` characters off
# rows that are not `lens` rows, despeckles inside `hair` and `texture` and keeps only `hair`
# (minus its first character, the outline) on the row below the jaw, each of those two passes
# only where it does not lower the view's score; `--mirror-swap` swaps `texture` and `hair` and
# caps a lens with `caps`. Anything not listed (a mask, an ear, skin) is left alone.
[head.classes]
hair = "kbHDid"      # outline first, then the mane's base, shade, deep, light
texture = ""        # a second surface cleaned like hair (a shaved side): "uUw" on Juno; "" if none
lens = "v"
rim = "x"
caps = "x"

# The legend: every material the mockup paints on the head AND in the grid's rows beside and
# below it (a collar, a mask, a hat) — the draft picks legend colours only; `--all-slots` adds
# the missing ones itself.
[head.legend]
b = "hair.base"
H = "hair.shade"    # strand lines
D = "hair.deep"
i = "hair.light"
d = "hair.dark"     # the shadowed nape and deepest strands
k = "hair.ink"      # hair outline
S = "skin.base"
s = "skin.shade"
z = "skin.dark"     # skin under the hair's shadow (nape, temples)
x = "visor.base"    # goggle rims and strap
v = "glow.base"     # lens
o = "outline.base"  # outline drawn by the grid (an ear beside the head)
m = "mask.base"     # respirator half-mask
M = "mask.shade"    # its dark seams
"-" = "clear"
C = "#515151"   # chrome.shade at draft time (--all-slots); a literal, so the grid keeps this colour
G = "#b4d63c"   # glow.light at draft time (--all-slots); a literal, so the grid keeps this colour
J = "#3a315b"   # jacket.shade at draft time (--all-slots); a literal, so the grid keeps this colour
V = "#3b3839"   # visor.shade at draft time (--all-slots); a literal, so the grid keeps this colour
c = "#999895"   # chrome.base at draft time (--all-slots); a literal, so the grid keeps this colour
g = "#88a223"   # glow.shade at draft time (--all-slots); a literal, so the grid keeps this colour
j = "#4a3f75"   # jacket.base at draft time (--all-slots); a literal, so the grid keeps this colour
l = "#c8c7c3"   # chrome.light at draft time (--all-slots); a literal, so the grid keeps this colour
p = "#685f41"   # pants.base at draft time (--all-slots); a literal, so the grid keeps this colour
t = "#9ebe34"   # trim.base at draft time (--all-slots); a literal, so the grid keeps this colour
B = "#b5b5b6"   # --all-slots: the nearest slot was chrome.base; a literal (the grid keeps this colour); rename or move it to the ramp it depicts


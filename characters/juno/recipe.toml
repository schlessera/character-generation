# Juno "Static" Okafor: rooftop data courier. Concept art: concept/
name = "Juno"

# Ramps. Template tones map to slots: base, shade, light, blush, ink (fill ink).
# A ramp without `ink` keeps the template's ink (outlines, eyes).
[palette]
skin    = { base = "#b07148", shade = "#7f4a2d", light = "#95593a", blush = "#b8624f" }
stubble = { base = "#6e4330", shade = "#5a3526", light = "#5a3526", ink = "#2b1a14" }
hair    = { base = "#e8358c", shade = "#a81f63", light = "#ff6fb0", ink = "#3c0f2a" }
jacket  = { base = "#34323d", shade = "#23222a", light = "#2b2a33", ink = "#141318" }
pants   = { base = "#4a4f5e", shade = "#353945", light = "#3f4452", ink = "#1b1d24" }
shoes   = { base = "#f1f2f4", shade = "#b7bcc6", light = "#d5d9df" }
chrome  = { base = "#d9e1ea", shade = "#8894a3", light = "#f4f8fb", ink = "#3a4250" }
fx      = { base = "#8ff8ff", shade = "#3cc4e6", light = "#c8fcff" }
orange  = { base = "#ff7a1a", shade = "#d9560a" }
cyan    = { base = "#3ff0ff", shade = "#1aa6c4" }

# Part/group -> ramp. Later lines override earlier ones.
[parts]
head = "skin"
neck = "skin"
body = "jacket"
hand_l = "skin"
legs = "pants"
feet = "shoes"
"arm_r+hand_r" = "chrome"
fx = "fx"

[outline]
color = "#120d14"

# Procedural details from label geometry. color: "#hex", "ramp" (tone-relative) or "ramp.slot".
[[rules]]  # high collar
type = "edge"
part = "torso"
touching = "neck"
color = "orange"

[[rules]]  # jacket hem
type = "edge"
part = "torso"
touching = "legs"
sides = ["down"]
color = "orange"

[[rules]]  # zipper
type = "stripe"
part = "torso"
facings = ["down", "down_side", "down_side_l"]
color = "orange.base"

[[rules]]  # sleeve cuff
type = "edge"
part = "arm_l"
touching = "hand_l"
color = "orange"

[[rules]]  # cyber wrist joint glow
type = "edge"
part = "arm_r"
touching = "hand_r"
color = "cyan"

[[rules]]  # orange soles
type = "rows"
part = "feet"
from = "bottom"
n = 1
color = "orange"

[head.legend]
h = "hair"          # tone-relative: template outline becomes hair outline, shading carries over
b = "hair.base"
H = "hair.shade"
i = "hair.light"
k = "hair.ink"
u = "stubble"
v = "cyan.base"
V = "cyan.shade"
S = "skin.base"
x = "#1b2230"       # visor glass
"-" = "clear"

# Head grids: head template padded by 3 px, '.' = unchanged. Print aligned with
# `just heads juno`. Missing *_l facings mirror the right-facing grid.

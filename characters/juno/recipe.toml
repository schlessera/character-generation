# Juno "Static" Okafor: rooftop data courier. Concept art: concept/
name = "Juno"
rule_facing = "body"   # trim follows the body through the spinning attack (front/back from the arms, side from the head)
emissive = ["cyan"]    # ramps that glow: the visor lens and the cyber-arm's joints stay lit in the dark
emissive_strength = 0.5  # how self-lit they are: 0 = lit like the rest of her, 1 = full brightness
emissive_parts = { "arm_r+hand_r" = 1.0 }  # the cyber-arm's joints glow at full brightness
# the soft glow she casts on the roof, centered under her cyber-arm in every frame
light = { color = "#3ff0ff", radius = 24, intensity = 0.2, anchor = "arm_r+hand_r" }

# Ramps. Template tones map to slots: base, shade, light, blush, ink (fill ink).
# A ramp without `ink` keeps the template's ink (outlines, eyes).
[palette]
skin    = { base = "#ad7043", shade = "#96603a", light = "#95593a", blush = "#a8653f" }  # lit evenly; the template's cheek shade is too deep for her
stubble = { base = "#553e30", shade = "#42222f", light = "#74533f", ink = "#2b1a14" }  # the shade under the mane picks up its magenta
hair    = { base = "#c22e6e", shade = "#9e2a5f", light = "#cc3276", deep = "#83254f", ink = "#261b19" }
jacket  = { base = "#36363d", shade = "#232328", light = "#2e2e34", ink = "#232120" }
pants   = { base = "#34353a", shade = "#323338", light = "#3c3d42", ink = "#141417" }
shirt   = { base = "#26252b", shade = "#1c1b21" }
shoes   = { base = "#dcdcde", shade = "#d9d6d6", light = "#d6d6da" }
chrome  = { base = "#b2b6bc", shade = "#7a7e80", light = "#dfe2e6", ink = "#34383f" }
fx      = { base = "#8ff8ff", shade = "#3cc4e6", light = "#c8fcff" }
orange  = { base = "#f06a1e", shade = "#e86218" }
cyan    = { base = "#44e4e8", shade = "#1aa6c4", light = "#c6fdff" }
outline = { base = "#241a17" }   # the mockup's warm dark brown, on the silhouette and the ear
visor   = { base = "#1a191d", shade = "#3b3839" }   # the dark rim above the lens, the grey rim below

# Part/group -> ramp. Later lines override earlier ones.
[parts]
head = "skin"
body = "jacket"
neck = "skin"       # after body: the neck shows between the collar tips
hand_l = "skin"
legs = "pants"
feet = "shoes"
"arm_r+hand_r" = "chrome"
fx = "fx"

[outline]
color = "outline"
keep = "kSs"        # head-grid chars that stay as drawn on the silhouette: hair outline, ear

# Procedural details from label geometry. color: "#hex", "ramp" (tone-relative) or "ramp.slot".
# The template tucks the far arm behind the torso in the 3/4 views; the mockup's puffy sleeve
# shows beside it. `grow` changes the silhouette, so these come first.
[[rules]]  # 3/4 front: the far sleeve and hand two pixels out toward the front
type = "grow"
part = "arm_l"
sides = ["front"]
n = 2
facings = ["down_side", "down_side_l"]
color = "jacket.base"

[[rules]]
type = "grow"
part = "hand_l"
sides = ["front"]
n = 2
facings = ["down_side", "down_side_l"]
color = "skin.base"

# Long sleeves: the jacket hangs over the left hand, only the fingertips show past the cuff.
# (The cyber-arm's hand is chrome like its sleeve, so it needs no rule.) The inner side of
# the hand is named per facing, because mirroring swaps the anatomical labels.
[[rules]]  # 3/4 front, the far hand
type = "region"
part = "hand_l"
anchor = "left"
n = 2
facings = ["down_side"]
color = "jacket.base"

[[rules]]  # front, and the mirrored 3/4 where the left hand is the near one
type = "region"
part = "hand_l"
anchor = "left"
n = 1
facings = ["down", "down_side_l"]
color = "jacket.base"

[[rules]]  # from behind and 3/4 behind
type = "region"
part = "hand_l"
anchor = "right"
n = 1
facings = ["up", "up_side", "up_side_l"]
color = "jacket.base"

[[rules]]  # 3/4 front: the near arm stands one pixel further out from the body, and the
type = "grow"  # jacket's shadow line runs between it and the torso
part = "arm_r+hand_r"
sides = ["back"]
facings = ["down_side"]
color = "chrome.base"

[[rules]]
type = "region"
part = "arm_r"
anchor = "front"
n = 1
facings = ["down_side"]
color = "jacket.shade"

[[rules]]  # ...and the mirrored view, where the near arm is the jacket sleeve
type = "grow"
part = "arm_l"
sides = ["back"]
facings = ["down_side_l"]
color = "jacket.base"

[[rules]]
type = "region"
part = "arm_l"
anchor = "front"
n = 1
facings = ["down_side_l"]
color = "jacket.shade"

[[rules]]  # 3/4 back: the far (cyber) arm one pixel out
type = "grow"
part = "arm_r"
sides = ["front"]
facings = ["up_side", "up_side_l"]
color = "chrome.base"

[[rules]]  # the far shoulder of the jacket, above the sleeve: two pixels out in 3/4 front, one behind
type = "grow"
part = "torso"
sides = ["front"]
n = 2
facings = ["down_side", "down_side_l"]
color = "jacket.base"

[[rules]]
type = "grow"
part = "torso"
sides = ["front"]
facings = ["up_side", "up_side_l"]
color = "jacket.base"

[[rules]]  # 3/4 views: the flank turned away from the front, one shade darker (before the
type = "region"  # trim, so the collar and hem paint over it)
part = "torso"
anchor = "back"
n = 1
facings = ["down_side", "down_side_l"]
color = "jacket.shade"

[[rules]]  # 3/4 back: the cyber-arm's shoulder cap overlaps the jacket's edge (the template
type = "region"  # starts the far arm two rows lower, hidden behind the torso)
part = "torso"
anchor = "front"
n = 2
skip = 1
top = 2
facings = ["up_side", "up_side_l"]
color = "chrome.base"

[[rules]]  # the standing collar. From the front: one straight row across the jacket's top
type = "rows"  # (an edge against the neck would follow the neck's curve); the zipper notches it
part = "torso"
from = "top"
n = 1
facings = ["down", "down_side", "down_side_l"]
color = "orange"

[[rules]]  # ...from behind it hides the neck entirely
type = "all"
part = "neck"
ink = true
facings = ["up", "up_side", "up_side_l"]
color = "orange"

[[rules]]  # ...and in profile its back panel shows behind the neck
type = "region"
part = "neck"
anchor = "back"
n = 2
ink = true
facings = ["side", "side_l"]
color = "orange"

[[rules]]  # the collar standing up behind the neck in profile and from behind
type = "stripe"
part = "neck"
anchor = "back"
facings = ["side", "side_l", "up_side", "up_side_l"]
color = "orange"

[[rules]]  # jacket hem; the zipper rules split it at the opening, as on an open bomber (the template
# draws the jacket's bottom edge in ink: paint that too)
type = "edge"
part = "torso"
touching = "legs"
sides = ["down"]
ink = true
color = "orange"

[[rules]]  # open jacket: two orange zipper edges...
type = "stripe"
straight = true
part = "torso"
offset = -1
facings = ["down"]
color = "orange.base"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offset = 1
facings = ["down"]
color = "orange.base"

[[rules]]  # ...over a black shirt
type = "stripe"
straight = true
part = "torso"
offset = 0
facings = ["down"]
color = "shirt"

[[rules]]  # 3/4 view: the chest shows in the collar's opening, on the shirt column
type = "stripe"
straight = true
part = "torso"
offset = 1
top = 1
facings = ["down_side", "down_side_l"]
color = "skin.shade"

[[rules]]  # neck skin dipping into the collar
type = "stripe"
part = "torso"
offset = 0
top = 1
facings = ["down"]
color = "skin.shade"

[[rules]]  # 3/4 view: both zipper edges and the shirt between, toward the front (the far
type = "stripe"  # edge sits on the template's ink column, painted too)
straight = true
part = "torso"
offset = 0
facings = ["down_side", "down_side_l"]
color = "orange.base"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offset = 1
ink = true
facings = ["down_side", "down_side_l"]
color = "shirt"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offset = 2
ink = true
facings = ["down_side", "down_side_l"]
color = "orange.base"

[[rules]]  # profile: the zipper runs down the jacket's front edge, which the template draws in ink
type = "stripe"
part = "torso"
anchor = "front"
straight = true
offset = 0
ink = true
facings = ["side", "side_l"]
color = "orange.base"

[[rules]]  # back: collar tab
type = "stripe"
part = "torso"
top = 2
facings = ["up"]
color = "orange"

[[rules]]  # sleeve cuff
type = "edge"
part = "arm_l"
touching = "hand_l"
color = "orange.shade"

[[rules]]  # sleeve crease at the elbow
type = "band"
part = "arm_l"
at = 0.5
color = "jacket.shade"

[[rules]]  # cyber elbow: plate seam with a glowing joint
type = "band"
part = "arm_r"
at = 0.5
color = "chrome.shade"

[[rules]]
type = "band"
part = "arm_r"
at = 0.5
anchor = "center"
color = "cyan.base"

[[rules]]  # shoulder cap seam
type = "band"
part = "arm_r"
at = 0.0
color = "chrome.shade"

[[rules]]  # cyber wrist: joint ring with one glowing seam pixel
type = "edge"
part = "arm_r"
touching = "hand_r"
color = "chrome.shade"

[[rules]]
type = "band"
part = "arm_r"
at = 1.0
anchor = "center"
color = "cyan.base"

[[rules]]  # cargo pockets on the outer thighs
type = "band"
part = "leg_r"
at = 0.3
anchor = "left"
offset = 1
facings = ["down"]
color = "pants.light"

[[rules]]
type = "band"
part = "leg_l"
at = 0.3
anchor = "right"
offset = -1
facings = ["down"]
color = "pants.light"

[[rules]]
type = "band"
part = "leg_r"
at = 0.3
anchor = "right"
offset = -1
facings = ["up"]
color = "pants.light"

[[rules]]
type = "band"
part = "leg_l"
at = 0.3
anchor = "left"
offset = 1
facings = ["up"]
color = "pants.light"

[[rules]]  # sneakers one pixel wider than the template's feet: both sides from the front and
type = "grow"  # behind, toward the toes in the 3/4 views (in profile the template's foot is
part = "feet"  # already as long as the mockup's)
sides = ["left", "right"]
facings = ["down", "up"]
color = "shoes.base"

[[rules]]
type = "grow"
part = "feet"
sides = ["front"]
facings = ["down_side", "down_side_l", "up_side", "up_side_l"]
color = "shoes.base"

[[rules]]  # high-tops: the sneaker reaches one row up the leg
type = "rows"
part = "legs"
from = "bottom"
n = 1
color = "shoes.base"

[[rules]]  # cyber-hand: a dark gap between the articulated fingers
type = "rows"
part = "hand_r"
from = "bottom"
n = 1
color = "chrome.shade"

[[rules]]
type = "band"
part = "hand_r"
at = 1.0
anchor = "center"
color = "chrome.ink"

[[rules]]  # polished forearm plate catching the light on its outer edge
type = "band"
part = "arm_r"
at = 0.75
anchor = "back"
color = "chrome.light"

[[rules]]  # a far cyber-arm the template draws as a dark silhouette still reads as chrome
type = "all"
part = "arm_r+hand_r"
ink = true
only_if_ink = true
color = "chrome.shade"

[[rules]]
type = "band"
part = "arm_r"
at = 0.5
anchor = "center"
ink = true
only_if_ink = true
color = "cyan.base"

[[rules]]  # pale soles
type = "rows"
part = "feet"
from = "bottom"
n = 1
color = "shoes.shade"

[[rules]]  # orange toe and heel caps: the outer pixels of the shoe's upper row
type = "band"
part = "foot_r"
at = 0.0
anchor = "left"
color = "orange.base"

[[rules]]
type = "band"
part = "foot_r"
at = 0.0
anchor = "right"
color = "orange.base"

[[rules]]
type = "band"
part = "foot_l"
at = 0.0
anchor = "left"
color = "orange.base"

[[rules]]
type = "band"
part = "foot_l"
at = 0.0
anchor = "right"
color = "orange.base"

[head.legend]
h = "hair"          # tone-relative: template outline becomes hair outline, shading carries over
b = "hair.base"
H = "hair.shade"
D = "hair.deep"     # strand lines between the waves
i = "hair.light"
k = "hair.ink"
u = "stubble.base"
U = "stubble.shade" # stubble texture: u/U checker reads as buzzed hair
w = "stubble.light" # the circuit pattern shaved into the undercut
S = "skin.base"
s = "skin.shade"
v = "cyan.base"
V = "cyan.shade"
x = "visor.base"    # visor frame, the dark rim above the lens
f = "visor.shade"   # the grey rim below the lens
o = "outline.base"  # outline (ear sticking out of the head silhouette)
"-" = "clear"


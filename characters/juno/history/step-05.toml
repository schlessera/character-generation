# Juno "Static" Okafor: rooftop data courier. Concept art: concept/
name = "Juno"

# Ramps. Template tones map to slots: base, shade, light, blush, ink (fill ink).
# A ramp without `ink` keeps the template's ink (outlines, eyes).
[palette]
skin    = { base = "#b07148", shade = "#7f4a2d", light = "#95593a", blush = "#b8624f" }
stubble = { base = "#5e3c2c", shade = "#452a1f", light = "#6e4a36", ink = "#2b1a14" }
hair    = { base = "#d8307c", shade = "#a8225f", light = "#f25a9e", deep = "#7c1a4a", ink = "#3c0f2a" }
jacket  = { base = "#3b3946", shade = "#24232c", light = "#302e3a", ink = "#141318" }
pants   = { base = "#2c2a33", shade = "#1c1b21", light = "#24222a", ink = "#0e0d12" }
shirt   = { base = "#16151b", shade = "#101014" }
shoes   = { base = "#f1f2f4", shade = "#b7bcc6", light = "#d5d9df" }
chrome  = { base = "#c3ccd6", shade = "#7c8796", light = "#eef3f8", ink = "#3a4250" }
fx      = { base = "#8ff8ff", shade = "#3cc4e6", light = "#c8fcff" }
orange  = { base = "#ff7a1a", shade = "#d9560a" }
cyan    = { base = "#3ff0ff", shade = "#1aa6c4" }

# Part/group -> ramp. Later lines override earlier ones.
[parts]
head = "skin"
neck = "skin"
body = "jacket"
hand_l = "skin"
legs = "pants"
feet = "shoes"
"arm_r+hand_r" = "chrome"
fx = "fx"

[outline]
color = "#120d14"

# Procedural details from label geometry. color: "#hex", "ramp" (tone-relative) or "ramp.slot".
[[rules]]  # high collar
type = "edge"
part = "torso"
touching = "neck"
color = "orange"

[[rules]]  # collar flaps standing up beside the neck
type = "stripe"
part = "neck"
anchor = "left"
facings = ["down", "down_side", "down_side_l"]
color = "orange"

[[rules]]
type = "stripe"
part = "neck"
anchor = "right"
facings = ["down", "down_side", "down_side_l"]
color = "orange"

[[rules]]  # jacket hem
type = "edge"
part = "torso"
touching = "legs"
sides = ["down"]
color = "orange"

[[rules]]  # open jacket: two orange zipper edges...
type = "stripe"
part = "torso"
offset = -1
facings = ["down"]
color = "orange.base"

[[rules]]
type = "stripe"
part = "torso"
offset = 1
facings = ["down"]
color = "orange.base"

[[rules]]  # ...over a black shirt
type = "stripe"
part = "torso"
offset = 0
facings = ["down"]
color = "shirt"

[[rules]]  # neck skin dipping into the collar
type = "stripe"
part = "torso"
offset = 0
top = 1
facings = ["down"]
color = "skin.shade"

[[rules]]  # 3/4 view: near zipper edge, shirt showing toward the front
type = "stripe"
part = "torso"
offset = 0
facings = ["down_side", "down_side_l"]
color = "orange.base"

[[rules]]
type = "stripe"
part = "torso"
offset = 1
facings = ["down_side", "down_side_l"]
color = "shirt"

[[rules]]  # profile: zipper edge along the jacket front
type = "stripe"
part = "torso"
anchor = "front"
offset = -1
facings = ["side", "side_l"]
color = "orange.base"

[[rules]]  # back: collar tab
type = "stripe"
part = "torso"
top = 3
facings = ["up"]
color = "orange"

[[rules]]  # sleeve cuff
type = "edge"
part = "arm_l"
touching = "hand_l"
color = "orange"

[[rules]]  # jacket side shading where the sleeves meet the body
type = "edge"
part = "torso"
touching = "arms"
color = "jacket.shade"

[[rules]]  # sleeve crease at the elbow
type = "band"
part = "arm_l"
at = 0.5
color = "jacket.shade"

[[rules]]  # cyber elbow: plate seam with a glowing joint
type = "band"
part = "arm_r"
at = 0.5
color = "chrome.ink"

[[rules]]
type = "band"
part = "arm_r"
at = 0.5
anchor = "center"
color = "cyan.base"

[[rules]]  # shoulder cap seam
type = "band"
part = "arm_r"
at = 0.0
color = "chrome.shade"

[[rules]]  # cyber wrist: dark joint ring with one glowing seam pixel
type = "edge"
part = "arm_r"
touching = "hand_r"
color = "chrome.ink"

[[rules]]
type = "band"
part = "arm_r"
at = 1.0
anchor = "center"
color = "cyan.base"

[[rules]]  # orange soles
type = "rows"
part = "feet"
from = "bottom"
n = 1
color = "orange"

[head.legend]
h = "hair"          # tone-relative: template outline becomes hair outline, shading carries over
b = "hair.base"
H = "hair.shade"
D = "hair.deep"     # strand lines between the waves
i = "hair.light"
k = "hair.ink"
u = "stubble.base"
U = "stubble.shade" # stubble texture: u/U checker reads as buzzed hair
S = "skin.base"
s = "skin.shade"
v = "cyan.base"
V = "cyan.shade"
x = "#1b2230"       # visor frame
"-" = "clear"


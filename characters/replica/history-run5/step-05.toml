# replica: a rooftop courier, magenta undercut, LED visor, chrome right arm, dark bomber with orange trim. Concept art and pixel mockup: concept/
#
# Start: copy to characters/NAME/recipe.toml. The palette below is Juno's (a dark-skinned courier
# with magenta hair, a charcoal bomber, orange trim, white sneakers, a chrome arm): a starting point,
# not placeholders. Compare it with the mockup's main colours (`just compare NAME --hex VIEW ...`)
# and refit every slot that differs. Then draft the head grids with `--draft-grid`. The rules are
# the patterns that held for a jacket-and-sneakers design with one cyber-arm; keep what the design
# has, delete the rest, add what it needs. Every rule says why it exists: the next reader is an
# agent with the text view open.
#
# Facings: down, down_side, side, up_side, up, and the mirrored down_side_l, side_l, up_side_l.
# Mirroring swaps the anatomical labels and the meaning of front/back. A rule for a ONE-SIDED
# feature (the cyber-arm, the far sleeve, an ear) must name its facings explicitly and usually
# must not include the `_l` twin; symmetric trim (collar, hem, zipper) can list both.
name = "replica"
rule_facing = "body"    # trim follows the body through spinning poses: side from the tracked head, front/back from the arms
emissive = ["glow"]     # ramps that stay lit in the dark (the lens, the arm's joints)
emissive_strength = 0.5
emissive_parts = { "arm_r+hand_r" = 1.0 }
light = { color = "#3ff0ff", radius = 24, intensity = 0.2, anchor = "arm_r+hand_r" }

# Ramps. Template tones pick slots: base, shade, light, blush, ink. Without `ink` the template's
# ink stays (outlines, eyes). Every legend entry below is a FIXED slot (`hair.base`), never a
# tone-relative ramp name: `--draft-grid` picks legend characters by nearest colour.
[palette]
skin    = { base = "#ad7043", shade = "#96603a", light = "#95593a", blush = "#a8653f" }  # face lit evenly: a mockup's cheek shade is far lighter than the template's
hair    = { base = "#c22e6e", shade = "#9e2a5f", light = "#cc3276", deep = "#83254f", ink = "#261b19" }
stubble = { base = "#553e30", shade = "#42222f", light = "#74533f", ink = "#2b1a14" }  # shaved side; the shade is plum: shadow under the magenta mane
jacket  = { base = "#36363d", shade = "#232328", light = "#2e2e34", ink = "#232120" }
pants   = { base = "#34353a", shade = "#323338", light = "#3c3d42", ink = "#141417" }
shirt   = { base = "#2e2f2b", shade = "#222320" }
shoes   = { base = "#dcdcde", shade = "#d9d6d6", light = "#d6d6da" }
chrome  = { base = "#b2b6bc", shade = "#7a7e80", light = "#dfe2e6", ink = "#34383f" }
trim    = { base = "#f06a1e", shade = "#e86218" }
glow    = { base = "#44e4e8", shade = "#1aa6c4", light = "#c6fdff" }
fx      = { base = "#8ff8ff", shade = "#3cc4e6", light = "#c8fcff" }               # the attack's swing smears
outline = { base = "#241a17" }                       # silhouette and the legend's `o`; a warm dark brown, not black
visor   = { base = "#1a191d", shade = "#3b3839" }    # rim above the lens, rim below

# Part/group -> ramp. LATER LINES WIN: groups first, specific parts after (a `neck` line before
# `body` is silently overridden — it happened). `fx` unmapped renders the attack smears as blobs.
[parts]
head = "skin"
body = "jacket"
neck = "skin"
hand_l = "skin"
legs = "pants"
feet = "shoes"
"arm_r+hand_r" = "chrome"    # the cyber-arm, anatomical right in every frame
fx = "fx"

[outline]
color = "outline"
keep = "kSs"        # legend chars that keep their colour on the silhouette edge (hair outline, ear)
parts = { legs = "pants.ink" }   # selective outlining: the joggers edged in a cool black, the rest warm

# ---- silhouette first: `grow` changes the outline, later rules see the grown labels ----------
# Only where `--widths` shows the mockup 2+ pixels wider, and with a name. A general bulk grow
# overshoots (the metric already forgives one pixel). One-sided: no `_l` twins here.
[[rules]]  # 3/4 front: the far sleeve and hand stand beside the torso (the template tucks them behind)
type = "grow"
part = "arm_l"
sides = ["front"]
n = 2
facings = ["down_side"]
color = "jacket.base"

[[rules]]
type = "grow"
part = "hand_l"
sides = ["front"]
n = 2
facings = ["down_side"]
color = "skin.base"

[[rules]]  # 3/4 back: the far shoulder stands out above the far sleeve
type = "grow"
part = "torso"
sides = ["front"]
n = 2
facings = ["up_side"]
color = "jacket.base"

[[rules]]  # 3/4 front: this mockup's far shoulder is broader still (--widths +2..+3 on rows 18-23; n=4 blocks it out)
type = "grow"
part = "torso"
sides = ["front"]
n = 3
facings = ["down_side"]
color = "jacket.base"

[[rules]]  # 3/4 back: the far (cyber) arm one pixel out, and its shoulder cap over the jacket's edge
type = "grow"  # (an arm cannot grow into the torso, so the torso's edge takes the arm's colour)
part = "arm_r"
sides = ["front"]
facings = ["up_side"]
color = "chrome.base"

[[rules]]
type = "region"
part = "torso"
anchor = "front"
n = 2
skip = 1
top = 2
facings = ["up_side"]
color = "chrome.base"

[[rules]]  # 3/4 front: the near cyber-arm stands one pixel further out, with the jacket's shadow
type = "grow"  # line between it and the torso (growing without the seam makes a fat chrome arm)
part = "arm_r+hand_r"
sides = ["back"]
facings = ["down_side"]
color = "chrome.base"

[[rules]]
type = "region"
part = "arm_r+hand_r"   # the seam continues past the hand: it hangs off the hip
anchor = "front"
n = 1
facings = ["down_side"]
color = "jacket.shade"

[[rules]]  # square bomber shoulders: the jacket's top row one above the mannequin's, in every facing
type = "grow"
part = "torso"
sides = ["up"]
color = "jacket.base"

[[rules]]  # sneakers one pixel wider: both sides from the front and behind, toward the toes in 3/4,
type = "grow"  # nothing in profile (the template's foot is already as long as a mockup's)
part = "feet"
sides = ["left", "right"]
facings = ["down", "up"]
color = "shoes.base"

[[rules]]
type = "grow"
part = "feet"
sides = ["front"]
facings = ["down_side", "down_side_l", "up_side", "up_side_l"]
color = "shoes.base"

# ---- shading before trim, so the collar and hem paint over it -------------------------------
[[rules]]  # 3/4: the flank turned away from the front, one column, one shade darker
type = "region"
part = "torso"
anchor = "back"
n = 1
facings = ["down_side", "down_side_l"]
color = "jacket.shade"

# ---- collar: straight rows (an edge against the neck follows the neck's U and bends) ---------
[[rules]]  # front and 3/4: the torso's top row; the zipper rules notch it open
type = "rows"
part = "torso"
from = "top"
n = 1
facings = ["down", "down_side", "down_side_l"]
color = "trim"

[[rules]]  # from behind the standing collar hides the neck
type = "all"
part = "neck"
ink = true
facings = ["up", "up_side", "up_side_l"]
color = "trim.base"

[[rules]]  # profile: its back panel behind the neck
type = "region"
part = "neck"
anchor = "back"
n = 2
ink = true
facings = ["side", "side_l"]
color = "trim.base"

[[rules]]  # back: a short collar tab
type = "stripe"
part = "torso"
top = 2
facings = ["up"]
color = "trim"

[[rules]]  # the waistband's shadow: the jacket row above the hem one shade darker
type = "rows"
part = "torso"
from = "bottom"
n = 2
color = "jacket.shade"

# ---- hem before the zipper: an open jacket's hem is split by the opening --------------------
[[rules]]  # the template draws the jacket's bottom line in ink: paint it too (a fixed slot, so the
type = "edge"  # ink pixels get the trim colour and not the template's ink)
part = "torso"
touching = "legs"
sides = ["down"]
ink = true
color = "trim.base"

# ---- the opening, per facing ----------------------------------------------------------------
[[rules]]  # front: two edges over the shirt, one straight column each on twisted poses
type = "stripe"
straight = true
part = "torso"
offset = -1
facings = ["down"]
color = "trim.base"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offset = 1
facings = ["down"]
color = "trim.base"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offset = 0
facings = ["down"]
color = "shirt"

[[rules]]  # front: the collar's inner edges in shadow for two rows, so the neck shows in a V
type = "stripe"
straight = true
part = "torso"
offset = -1
top = 2
facings = ["down"]
color = "outline.base"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offset = 1
top = 2
facings = ["down"]
color = "outline.base"

[[rules]]  # neck skin dipping into the collar
type = "stripe"
part = "torso"
offset = 0
top = 1
facings = ["down"]
color = "skin.shade"

[[rules]]  # 3/4: the chest front projects toward the facing side; the far edge sits on the
type = "stripe"  # template's ink column, so paint ink
straight = true
part = "torso"
offset = 0
facings = ["down_side", "down_side_l"]
color = "trim.base"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offset = 1
ink = true
facings = ["down_side", "down_side_l"]
color = "shirt.base"

[[rules]]
type = "stripe"
straight = true
part = "torso"
offset = 2
ink = true
facings = ["down_side", "down_side_l"]
color = "trim.base"

[[rules]]  # profile: one pixel inside the front edge, following the chest (on the edge column the
type = "stripe"  # outline pass repaints it, and a straight median column only exists near the hem)
part = "torso"
anchor = "front"
offset = -1
facings = ["side", "side_l"]
color = "trim.base"

# ---- sleeves ---------------------------------------------------------------------------------
[[rules]]  # cuff, a shade darker than the hem so they do not merge where the hand hangs beside it
type = "edge"
part = "arm_l"
touching = "hand_l"
color = "trim.shade"

[[rules]]  # 3/4 front: the far sleeve's cuff only at its outer end (across the grown sleeve it met
type = "region"  # the zipper edge as a bar)
part = "arm_l"
anchor = "back"
n = 2
facings = ["down_side"]
color = "jacket.base"

# long sleeves: only the fingertips show. The inner side is named per facing because mirroring
# swaps the anatomical labels (hand_l is the far hand in one 3/4 view, the near one in the other).
[[rules]]
type = "region"
part = "hand_l"
anchor = "left"
n = 2
facings = ["down_side"]
color = "jacket.base"

[[rules]]
type = "region"
part = "hand_l"
anchor = "left"
n = 1
facings = ["down", "down_side_l"]
color = "jacket.base"

[[rules]]
type = "region"
part = "hand_l"
anchor = "right"
n = 1
facings = ["up", "up_side", "up_side_l"]
color = "jacket.base"

# ---- the cyber-arm: plates, joints, glow -----------------------------------------------------
[[rules]]  # elbow: plate seam with a glowing joint
type = "band"
part = "arm_r"
at = 0.5
color = "chrome.shade"

[[rules]]
type = "band"
part = "arm_r"
at = 0.5
anchor = "center"
color = "glow.base"

[[rules]]  # shoulder cap seam
type = "band"
part = "arm_r"
at = 0.0
color = "chrome.shade"

[[rules]]  # wrist: joint ring with one glowing seam pixel
type = "edge"
part = "arm_r"
touching = "hand_r"
color = "chrome.shade"

[[rules]]
type = "band"
part = "arm_r"
at = 1.0
anchor = "center"
color = "glow.base"

[[rules]]  # polished forearm plate catching the light on its outer edge (the mockup shows the
type = "band"  # glint only in 3/4 front, where the arm is nearest)
part = "arm_r"
at = 0.75
anchor = "back"
facings = ["down_side"]
color = "chrome.light"

[[rules]]  # the hand: a dark gap between the articulated fingers
type = "rows"
part = "hand_r"
from = "bottom"
n = 1
color = "chrome.shade"

[[rules]]  # a far arm the template draws as a dark silhouette still reads as chrome
type = "all"
part = "arm_r+hand_r"
ink = true
only_if_ink = true
color = "chrome.shade"

[[rules]]
type = "band"
part = "arm_r"
at = 0.5
anchor = "center"
ink = true
only_if_ink = true
color = "glow.base"

# ---- shoes -----------------------------------------------------------------------------------
[[rules]]  # high-tops: one row up the leg
type = "rows"
part = "legs"
from = "bottom"
n = 1
color = "shoes.base"

[[rules]]  # pale sole
type = "rows"
part = "feet"
from = "bottom"
n = 1
color = "shoes.shade"

[[rules]]  # caps at both ends of the shoe's upper row
type = "band"
part = "foot_r"
at = 0.0
anchor = "left"
color = "trim.base"

[[rules]]
type = "band"
part = "foot_r"
at = 0.0
anchor = "right"
color = "trim.base"

[[rules]]
type = "band"
part = "foot_l"
at = 0.0
anchor = "left"
color = "trim.base"

[[rules]]
type = "band"
part = "foot_l"
at = 0.0
anchor = "right"
color = "trim.base"

# ---- head grids: `just compare NAME --draft-grid all --clean --apply --mirror-swap` -----------
# Grid = head template padded by 3, '.' keeps the template. `just heads NAME` prints alignment.
# The five mockup views are drafted from the mockup; the three `_l` views are mirrored from
# their twins (with mane and shaved side swapped for a one-sided cut; drop --mirror-swap for a
# symmetric one) and must be checked against the playbook's near-side table.
[head.legend]
b = "hair.base"
H = "hair.shade"    # strand lines
D = "hair.deep"
i = "hair.light"
k = "hair.ink"      # hair outline
u = "stubble.base"  # shaved side: u/U checker
U = "stubble.shade" # ...and the plum shadow where the mane meets it
w = "stubble.light" # a pattern shaved into the undercut
S = "skin.base"
s = "skin.shade"
x = "visor.base"    # rim above the lens (also the lens' end caps: no glint)
v = "glow.base"     # lens
f = "visor.shade"   # rim below the lens
o = "outline.base"  # outline drawn by the grid (an ear beside the head)
"-" = "clear"


[project]
name = "chargen"
version = "0.1.0"
description = "Semantic sprite skinning: AI-directed pixel-art characters painted onto a labeled, hand-animated template, with props and a small browser playground"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]
